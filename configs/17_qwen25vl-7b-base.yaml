# Indic_Agri_Benchmark model config -- Stage 1 (candidate generation)
# run settings for this model: repo id, backend, and the real runtime
# args (gpu_memory_utilization, max_model_len, batch_size, gen_kwargs)
# pulled from its actual results_*.json. Stage 2 (judge) settings for
# every model are in configs/stage2.yaml; leaderboard scores
# are in the main README.md.
model_key: qwen25vl-7b-base
rank_by_correctness: 17
model:
  repo: unsloth/Qwen2.5-VL-7B-Instruct
  chat: true
  backend: vllm
  notes: Un-fine-tuned baseline for the qwen25vl-7b-ep*/3ep-* LoRA checkpoints; added
    2026-09-02.
  stage1_runtime:
    gpu_memory_utilization: 0.9
    max_model_len: 4096
    dtype: auto
    enable_prefix_caching: true
    batch_size: auto
    gen_kwargs:
      temperature: 0.0
      top_p: 1.0
      max_gen_toks: 1024
