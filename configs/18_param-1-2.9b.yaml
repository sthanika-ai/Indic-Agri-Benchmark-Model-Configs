# Indic_Agri_Benchmark model config -- Stage 1 (candidate generation)
# run settings for this model: repo id, backend, and the real runtime
# args (gpu_memory_utilization, max_model_len, batch_size, gen_kwargs)
# pulled from its actual results_*.json. Stage 2 (judge) settings for
# every model are in configs/stage2.yaml; leaderboard scores
# are in the main README.md.
model_key: param-1-2.9b
rank_by_correctness: 18
model:
  repo: bharatgenai/Param-1-2.9B-Instruct
  chat: true
  backend: hf
  lm_eval_bin: venv_old_hf/bin/lm_eval
  notes: HF backend (venv_old_hf, transformers 4.46.0) -- vLLM rejects this architecture.
    --batch_size auto miscalibrates badly for this model size; use a fixed batch_size
    (16) instead (see run_indic_agri_sweep.py HF_BACKEND_BATCH_SIZE).
  stage1_runtime:
    dtype: bfloat16
    extra_model_args: trust_remote_code=True
    batch_size: '16'
    gen_kwargs:
      temperature: 0.0
      top_p: 1.0
      max_gen_toks: 1024
