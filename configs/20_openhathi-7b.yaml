# Indic_Agri_Benchmark model config -- Stage 1 (candidate generation)
# run settings for this model: repo id, backend, and the real runtime
# args (gpu_memory_utilization, max_model_len, batch_size, gen_kwargs)
# pulled from its actual results_*.json. Stage 2 (judge) settings for
# every model are in configs/stage2.yaml; leaderboard scores
# are in the main README.md.
model_key: openhathi-7b
rank_by_correctness: 20
model:
  repo: sarvamai/OpenHathi-7B-Hi-v0.1-Base
  chat: false
  backend: hf
  lm_eval_bin: venv_old_hf/bin/lm_eval
  notes: Base checkpoint, not instruct-tuned -- chat=False. Needed 4 code patches
    (rope_scaling key mismatch, rope_type='default' handling, missing default_chat_template
    shim, chat_template.jinja backport) to load on transformers 4.46.0; vLLM rejects
    the architecture outright.
  stage1_runtime:
    gpu_memory_utilization: 0.93
    max_model_len: 4096
    dtype: auto
    enable_prefix_caching: true
    batch_size: auto
    gen_kwargs:
      temperature: 0.0
      top_p: 1.0
      max_gen_toks: 1024
