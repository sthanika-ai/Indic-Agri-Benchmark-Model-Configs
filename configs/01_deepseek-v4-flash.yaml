# Indic_Agri_Benchmark model config -- Stage 1 (candidate generation)
# run settings for this model: repo id, backend, and the real runtime
# args (gpu_memory_utilization, max_model_len, batch_size, gen_kwargs)
# pulled from its actual results_*.json. Stage 2 (judge) settings for
# every model are in configs/stage2.yaml; leaderboard scores
# are in the main README.md.
model_key: deepseek-v4-flash
rank_by_correctness: 1
model:
  repo: deepseek-v4-flash
  chat: true
  api: deepseek
  backend: hosted-api
  notes: 'Hosted via DeepSeek''s OpenAI-compatible endpoint (base_url https://api.deepseek.com/v1/chat/completions).
    Auth: DEEPSEEK_API_KEY in .env or shell, copied to OPENAI_API_KEY for the subprocess
    only.'
  stage1_runtime:
    base_url: https://api.deepseek.com/v1/chat/completions
    num_concurrent: 8
    max_retries: 5
    batch_size: '1'
    gen_kwargs:
      temperature: 0.0
      top_p: 1.0
      max_gen_toks: 8192
